<!DOCTYPE html>
<html lang="pt-BR">

    <script src="acessibilidade.js"></script>
    <title>Clash Stats - Carrossel</title>
</head>
<body>
    <main class="carrossel">
        <p class="nome-projeto">Clash Stats</p>
        <h1>Decks em destaque</h1>

        <div class="slide ativo">

        </div>

        <div class="slide">
            <img src="assets/RocketCard.png" alt="Foguete">

        <div class="slide">
            <img src="assets/GraveyardCard.png" alt="Cemitério">

        <div class="botoes-carrossel">
            <button id="anterior">Anterior</button>
            <button id="proximo">Próximo</button>

        <a href="index.html">Voltar para as estatísticas</a>
