<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Login</title>
</head>
<body>
    <form class="formulario-login">
        <h1 class="titulo-formulario-login">Login</h1>
        <div class="login">
            <img class="black-icon" src="user.png" alt="user icon">
            <input type="text" class="usuario" placeholder="Insira seu login" required>
        </div>
        <div class="senha">
            <img class="black-icon" src="lock.png" alt="lock icon">
            <input type="password" class="usuario" placeholder="Insira sua senha" required>
        </div>
        <button type="submit">Entrar</button>
        <a class="link-cadastro" href="cadastro.html">Cadastre-se</a>
    </form>
</body>
</html>
